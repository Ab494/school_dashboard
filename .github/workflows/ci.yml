name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:

  # ── Job 1: Lint ─────────────────────────────────────
  # flake8 checks Python code style
  # Similar to ESLint for JavaScript
  lint:
    name: Lint Python
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install flake8
        run: pip install flake8

      - name: Run flake8
        run: |
          flake8 . \
            --exclude=venv,env,.venv,migrations,staticfiles \
            --max-line-length=120 \
            --extend-ignore=W291,W293,W391,W292,E302,E303,E301,E305,E111,E114,E116,E121,E123,E126,E128,E225,E226,E203,E202,E251,E261,E271,E222,E402,E501,W503,E265,F401,F811,F841,F823

  # ── Job 2: Test ─────────────────────────────────────
  # Runs Django tests with a real PostgreSQL database
  test:
    name: Test Django
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: school_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip   # cache pip packages — faster builds

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Django tests
        run: python manage.py test
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DEBUG: "False"
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/school_test
          ALLOWED_HOSTS: localhost,127.0.0.1

  # ── Job 3: Build check ───────────────────────────────
  # Verifies collectstatic works — catches template/static file errors
  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: school_build
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run collectstatic
        run: python manage.py collectstatic --noinput
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DEBUG: "False"
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/school_build
          ALLOWED_HOSTS: localhost,127.0.0.1

      - name: Run migrations
        run: python manage.py migrate
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DEBUG: "False"
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/school_build
          ALLOWED_HOSTS: localhost,127.0.0.1

      - name: Check no pending migrations
        run: python manage.py migrate --check
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DEBUG: "False"
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/school_build
          ALLOWED_HOSTS: localhost,127.0.0.1

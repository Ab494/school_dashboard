services:
  - type: web
    name: school_dashboard
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: gunicorn school_dashboard.wsgi:application --bind 0.0.0.0:8000 --workers 2
    healthCheckPath: /health/
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: school-dashboard-lqng.onrender.com,localhost
      - key: CSRF_TRUSTED_ORIGINS
        value: https://school-dashboard-lqng.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: school_dashboard_db
          property: connectionString
      - key: LOG_LEVEL
        value: WARNING
